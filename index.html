
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IMR College Live Location</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f1f5f9;
        }

        header {
            background: #123b70;
            color: white;
            padding: 18px;
            text-align: center;
        }

        .panel {
            padding: 15px;
            background: white;
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            align-items: center;
        }

        button, .directions {
            padding: 11px 15px;
            background: #1769aa;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            text-decoration: none;
        }

        #map {
            width: 100%;
            height: 65vh;
            min-height: 380px;
        }

        #status {
            padding: 12px 15px;
            background: white;
            color: #222;
        }
    </style>
</head>

<body>

<header>
    <h2>IMR College Live Location Map</h2>
    <p>Institute of Management and Research, Jalgaon</p>
</header>

<div class="panel">
    <button onclick="startTracking()">Start Live Location</button>
    <button onclick="stopTracking()">Stop Tracking</button>

    <a class="directions"
       href="https://www.google.com/maps/dir/?api=1&destination=21.005838807%2C75.552333759"
       target="_blank" rel="noopener">
       Get Directions
    </a>
</div>

<div id="status">Click Start Live Location to find your position.</div>
<div id="map"></div>

<script>
    // IMR College coordinates
    const college = {
        lat: 21.005838807,
        lng: 75.552333759
    };

    let map;
    let collegeMarker;
    let userMarker;
    let watchId = null;

    function initMap() {
        map = new google.maps.Map(document.getElementById("map"), {
            center: college,
            zoom: 16,
            mapTypeControl: true,
            streetViewControl: true
        });

        collegeMarker = new google.maps.Marker({
            position: college,
            map: map,
            title: "IMR College, Jalgaon",
            label: "IMR"
        });

        const info = new google.maps.InfoWindow({
            content: "<strong>IMR College, Jalgaon</strong>"
        });

        collegeMarker.addListener("click", function () {
            info.open(map, collegeMarker);
        });
    }

    function startTracking() {
        if (!navigator.geolocation) {
            document.getElementById("status").textContent =
                "Geolocation is not supported by this browser.";
            return;
        }

        if (watchId !== null) return;

        document.getElementById("status").textContent =
            "Requesting location permission...";

        watchId = navigator.geolocation.watchPosition(
            function (position) {
                const userPosition = {
                    lat: position.coords.latitude,
                    lng: position.coords.longitude
                };

                if (!userMarker) {
                    userMarker = new google.maps.Marker({
                        position: userPosition,
                        map: map,
                        title: "Your Current Location",
                        icon: {
                            path: google.maps.SymbolPath.CIRCLE,
                            scale: 8,
                            fillColor: "#1687ff",
                            fillOpacity: 1,
                            strokeColor: "#ffffff",
                            strokeWeight: 2
                        }
                    });
                } else {
                    userMarker.setPosition(userPosition);
                }

                const distance =
                    google.maps.geometry.spherical.computeDistanceBetween(
                        new google.maps.LatLng(
                            userPosition.lat, userPosition.lng
                        ),
                        new google.maps.LatLng(college.lat, college.lng)
                    );

                document.getElementById("status").textContent =
                    "Live location updated. Accuracy: approximately " +
                    Math.round(position.coords.accuracy) +
                    " metres. Distance to college: " +
                    (distance / 1000).toFixed(2) + " km.";

                map.setCenter(userPosition);
            },
            function (error) {
                const messages = {
                    1: "Location permission denied. Please allow location access.",
                    2: "Your current location is unavailable.",
                    3: "Location request timed out."
                };

                document.getElementById("status").textContent =
                    messages[error.code] || "Unable to retrieve location.";

                stopTracking();
            },
            {
                enableHighAccuracy: true,
                maximumAge: 2000,
                timeout: 15000
            }
        );
    }

    function stopTracking() {
        if (watchId !== null) {
            navigator.geolocation.clearWatch(watchId);
            watchId = null;
        }

        document.getElementById("status").textContent =
            "Live tracking stopped.";
    }
</script>

<!-- Replace YOUR_API_KEY with your Google Maps API key.
     The geometry library calculates the distance. -->
<script async
    src="https://maps.googleapis.com/maps/api/js?key=AIzaSyAUYsiWMPJyJFNM38SqPbZbUKYwtQHXBEQ&libraries=geometry&callback=initMap">
</script>

</body>
</html>
